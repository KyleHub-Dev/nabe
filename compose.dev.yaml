name: nabe-dev

services:
  nabe-web:
    image: nabe-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NABE_API_URL: ${NABE_API_URL:-http://nabe-api:8080}
      VITE_NABE_API_URL: ${VITE_NABE_API_URL:-http://localhost:8080}
    ports:
      - "${NABE_WEB_BIND:-127.0.0.1:5173}:5173/tcp"
    depends_on:
      nabe-api:
        condition: service_started
    networks:
      - nabe-dns

  nabe-api:
    image: nabe-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NABE_API_HOST: ${NABE_API_HOST:-0.0.0.0}
      NABE_API_PORT: ${NABE_API_PORT:-8080}
      NABE_DATABASE_PATH: ${NABE_DATABASE_PATH:-/data/nabe.db}
      ADGUARD_BASE_URL: ${ADGUARD_BASE_URL:-http://dns-adguard:3000}
    volumes:
      - nabe-data:/data
    ports:
      - "${NABE_API_BIND:-127.0.0.1:8080}:8080/tcp"
    depends_on:
      dns-adguard:
        condition: service_started
    networks:
      - nabe-dns

  dns-unbound:
    image: docker.io/mvance/unbound:latest
    restart: unless-stopped
    networks:
      nabe-dns:
        ipv4_address: 172.30.10.10

  dns-adguard:
    image: docker.io/adguard/adguardhome:latest
    restart: unless-stopped
    depends_on:
      dns-unbound:
        condition: service_started
    ports:
      # Native AdGuard UI/API debug binding for local dev setup and inspection.
      - "${ADGUARD_DEBUG_BIND:-127.0.0.1:3000}:3000/tcp"
    expose:
      # AdGuard stays internal to the dev stack by default.
      - "443/tcp"
      - "853/tcp"
      - "853/udp"
    volumes:
      - ./data/config/adguard:/opt/adguardhome/conf:Z
      - ./data/state/adguard:/opt/adguardhome/work:Z
    environment:
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - nabe-dns
      - nabe-edge

  dns-newt:
    image: docker.io/fosrl/newt:latest
    restart: unless-stopped
    profiles:
      - edge
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      nabe-web:
        condition: service_started
      nabe-api:
        condition: service_started
      dns-adguard:
        condition: service_started
    networks:
      - nabe-edge

networks:
  nabe-dns:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  nabe-edge:
    driver: bridge

volumes:
  nabe-data:
    driver: local
