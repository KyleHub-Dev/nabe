name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm build
