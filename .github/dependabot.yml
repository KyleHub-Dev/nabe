version: 2

# Dependabot only opens pull requests. Do not add automerge rules for dependency
# updates; every update must be reviewed and pass CI before merging.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/apps/worker"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: "cargo"
    directories:
      - "/apps/api"
      - "/packages/adguard-adapter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: "gomod"
    directories:
      - "/apps/cli"
      - "/apps/speiche"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(go)"
